name: 🛠 Setup project

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      GOLDEN_PROJECT_OWNER: ${{ vars.GOLDEN_PROJECT_OWNER }}
      GOLDEN_PROJECT_NUMBER: ${{ vars.GOLDEN_PROJECT_NUMBER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply labels
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml --break-system-packages --quiet

      - name: Warn if PROJECTS_TOKEN missing
        if: env.PROJECTS_TOKEN == ''
        run: |
          echo "::warning::PROJECTS_TOKEN secret not set."

      - name: Warn if golden project vars missing
        if: env.GOLDEN_PROJECT_OWNER == '' || env.GOLDEN_PROJECT_NUMBER == ''
        run: |
          echo "::warning::GOLDEN_PROJECT_OWNER / GOLDEN_PROJECT_NUMBER vars not set."

      - name: Seed project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          GOLDEN_PROJECT_OWNER: ${{ vars.GOLDEN_PROJECT_OWNER }}
          GOLDEN_PROJECT_NUMBER: ${{ vars.GOLDEN_PROJECT_NUMBER }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/seed_project.py

      - name: Wait briefly
        run: sleep 10

      - name: First dashboard update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/update_dashboard.py

      - name: Done
        run: |
          echo "Setup complete!"
