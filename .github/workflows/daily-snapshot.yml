name: 📅 Daily snapshot

# Saves today's dashboard state to status-history/YYYY-MM-DD.md
# Runs at 02:00 UTC daily.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml --break-system-packages --quiet

      - name: Capture snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/daily_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add status-history/
            git commit -m "📅 Daily snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi
